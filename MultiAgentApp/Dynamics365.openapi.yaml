          description: ''
  /data/Projects:
    get:
      summary: GetProjects
      description: Retorna la lista de proyectos en el erp interno
      operationId: getprojects
      parameters:
        - name: ProjectName
          in: query
          description: Nombre o parte del nombre del proyecto o proyectos que se quieren consultar
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de proyectos del erp interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjects'
              example:
                '@@odata.context': string
                value:
                  - '@@odata.etag': string
                    dataAreaId: string
                    ProjectID: string
                    ActualStartDate: string
                    CertifiedPayroll: string
                    CanVerifyCostAgainstRemainingForecast: string
                    TrackCost: string
