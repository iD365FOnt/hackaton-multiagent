  /data/ProjectResources:
    get:
      summary: GetResource
      description: Devuelve información del trabajador o trabajadores dado el nombre o parte del nombre indicado en ResourceName.
      operationId: getresource
      parameters:
        - name: ResourceName
          in: query
          description: Nombre o parte del nombre del trabajador
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de trabajadores que coinciden con el nombre pasado por parámetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResourceResponseV2'
              example:
                '@@odata.context': string
                value:
                  - '@@odata.etag': string
                    ResourceId: string
                    ResourceCompanyId: string
                    PersonnelNumber: string
                    Name: string
                    VendId: string
                    Type: string
                    ALGResourceRecordId: 0
  /Timesheets:
    get:
      summary: GetTimesheetLines
      description: 'Devuelve las líneas de imputación de la semana del dia ''checkDate'' y filtradas por trabajador ''Resource'' '
      operationId: gettimesheetlines
      parameters:
        - name: Resource
          in: query
          description: Id del trabajador que se quiere comprobar
          required: true
          schema:
            type: integer
        - name: checkDate
          in: query
          description: Fecha de la semana que se quiere comprobar
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de líneas de imputación del recurso y semana consultada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTimesheetLinesV2'
              example:
                '@@odata.context': string
                value:
                  - Resource: 0
                    SaturdayHours: 0
                    ProjectName: string
                    SaturdayComments: string
                    ThursdayHours: 0.998545544512757
                    TuesdayComments: string
                    ThursdayComments: string
                    SundayHours: 0
                    ProjId: string
                    DayFrom: string
                    ActivityNumber: string
                    TuesdayHours: 0.655005024688835
                    MondayComments: string
                    MondayHours: 0
                    SundayComments: string
                    FridayHours: 0
                    ActivityDesc: string
                    FridayComments: string
                    WednesdayComments: string
                    WednesdayHours: 0
                    DayTo: string
                    ApprovalStatus: string
  /ResourcesList:
    get:
      summary: GetResourcesList
      description: Devuelve una lista de recursos activos a fecha 'CheckDate'
      operationId: getresourceslist
      parameters:
        - name: CheckDate
          in: query
          description: Fecha en la cual se quiere hacer la consulta
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de recursos activos a la fecha pasada por parámetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResourceList'
              example:
                '@@odata.context': string
                value:
                  - Resource: 0
                    Name: string
                    ValidTo: string
                    ValidFrom: string
  /TimesheetsDate:
    get:
      summary: GetTimesheetDate
      operationId: gettimesheetdate
      parameters:
        - name: checkDate
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
  /hours:
    get:
      summary: GetGroupedHours
      description: 'Devuelve una lista de los trabajadores con la suma de horas imputadas en la semana de la fecha ''checkDate'' '
      operationId: getgroupedhours
      parameters:
        - name: checkDate
          in: query
          description: Fecha de la semana que se quiere consultar
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de trabajadores que han imputado menos horas de las que deberían
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGroupedHours'
              example:
                '@@odata.context': string
                value:
                  - Resource: 0
                    DayTo: string
                    TotalHourSum: 0.220331485350472
                    DayFrom: string
  /clone-680a8/hours:
    get:
      summary: GetGroupedHours (clone)
      description: 'Devuelve una lista de los trabajadores que han imputado menos de ''totalHours'' horas en la semana de la fecha ''checkDate'' '
      operationId: 680a83c8cdfa0af869a91d11
      parameters:
        - name: checkDate
          in: query
          description: Fecha de la semana que se quiere consultar
          required: true
          schema:
            type: string
        - name: totalHours
          in: query
          description: Horas que teóricamente los trabajadores deben tener imputadas
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de trabajadores que han imputado menos horas de las que deberían
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGroupedHours'
              example:
                '@@odata.context': string
                value:
                  - Resource: 0
                    DayTo: string
                    TotalHourSum: 0.220331485350472
                    DayFrom: string
